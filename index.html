<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>华华关心</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at center, #13294b 0%, #060d1f 75%);
    color: #fff;
  }

  /* 弹窗 */
  .modal {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.35);
  }
  .modal-box {
    background: rgba(20,36,66,.92); border: 1px solid rgba(255,255,255,.15);
    border-radius: 20px; padding: 34px 26px; text-align: center;
    width: 82%; max-width: 340px; backdrop-filter: blur(8px);
    box-shadow: 0 12px 40px rgba(0,0,0,.4);
  }
  .modal-box .icon { font-size: 46px; margin-bottom: 14px; }
  .modal-box h2 { font-size: 18px; margin-bottom: 8px; }
  .modal-box p { font-size: 13px; color: rgba(255,255,255,.55); margin-bottom: 24px; }
  .modal-btns { display: flex; gap: 12px; }
  .modal-btns button {
    flex: 1; height: 44px; border-radius: 22px; border: none;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .cancel { background: rgba(255,255,255,.12); color: #ccc; }
  .confirm { background: linear-gradient(135deg, #ff6b9d, #ff4d79); color: #fff; }

  #stage { position: fixed; inset: 0; display: none; }
  
  .pen {
    position: absolute; width: 26px; height: 64px; z-index: 6;
    background: linear-gradient(180deg, #ff6b9d, #ff4d79);
    border-radius: 6px 6px 2px 2px; transform-origin: 50% 90%;
  }
  .pen::after {
    content: ''; position: absolute; bottom: -10px; left: 50%;
    transform: translateX(-50%);
    border-left: 5px solid transparent; border-right: 5px solid transparent;
    border-top: 10px solid #ff4d79;
  }

  /* 基础文字样式 */
  .word {
    position: absolute; white-space: nowrap; pointer-events: none;
    will-change: transform, opacity; 
    font-weight: bold;
    transform: translate(-50%, -50%); 
  }

  /* 画心阶段的发光字 */
  .glow-word {
    text-shadow: 0 0 8px currentColor, 0 0 15px currentColor; 
  }

  /* 满屏阶段的特效字（性能友好版） */
  .fx-word {
    /* 用极小的阴影模拟荧光，搭配混合模式不卡顿 */
    text-shadow: 0 0 4px currentColor;
    mix-blend-mode: screen; /* 屏幕叠加效果，超级炫酷且省性能 */
  }

  .music-btn {
    position: fixed; top: 18px; right: 16px; z-index: 30;
    padding: 8px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.1); color: #fff; font-size: 13px;
  }
  canvas#snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
</style>
</head>
<body>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="icon">❄️</div>
    <h2>是否收下这份关心？</h2>
    <p>华华给你准备了一份小惊喜～</p>
    <div class="modal-btns">
      <button class="cancel" id="cancelBtn">取消</button>
      <button class="confirm" id="confirmBtn">确定</button>
    </div>
  </div>
</div>

<div id="stage"><div class="pen" id="pen"></div></div>
<canvas id="snow"></canvas>
<button class="music-btn" id="musicBtn">🔊 音乐</button>
<audio id="bgm" preload="auto" loop></audio>

<script>
  // 词库扩充：加入了一些适合飘落的符号
  const winterWords = [
    "我想你了","我喜欢你","保持微笑呀","每天都要活力满满","保持好心情",
    "我想你了庄欣雨","庄欣雨","我喜欢你","梦想成真","烦恼归零",
    "少熬夜","少吃零食","愿我们长长久久","愿我们幸福","我喜欢你","早睡早起","我爱你庄欣雨",
    "❄️","✨","💖","💫" 
  ];
  const palette = ["#ff6b9d","#ff4d6d","#ffc371","#ffffff","#a8d8ff","#ff9eb5","#ffbd59","#ff7eb3"];

  const EXPLODE_AT = 8;

  const modal = document.getElementById("modal");
  const stage = document.getElementById("stage");
  const pen = document.getElementById("pen");
  const bgm = document.getElementById("bgm");
  const musicBtn = document.getElementById("musicBtn");

  bgm.src = "./sudi.mp3";

  let audioOn = false, exploded = false, heartDrawn = false, startTime = 0;

  document.getElementById("cancelBtn").addEventListener("click", () => {
    modal.innerHTML = `<div class="modal-box"><div class="icon">❄️</div><h2>没关系</h2><p>祝你冬至平安顺遂，温暖常伴</p></div>`;
  });

  document.getElementById("confirmBtn").addEventListener("click", () => {
    modal.style.display = "none";
    stage.style.display = "block";
    startTime = Date.now();
    startAudio();
    drawHeart();
    
    setInterval(() => {
      const elapsed = (Date.now() - startTime) / 1000;
      if (elapsed >= EXPLODE_AT) triggerExplode();
    }, 200);
  });

  function triggerExplode() {
    if (exploded) return;
    if (!heartDrawn) return; 
    if ((Date.now() - startTime) / 1000 < EXPLODE_AT) return; 
    exploded = true;
    explode();
  }

  /* ---------- 音频 ---------- */
  function startAudio() {
    bgm.volume = 0.8;
    bgm.play().then(() => {
      audioOn = true; musicBtn.innerText = "🔇 静音";
    }).catch(() => {
      audioOn = false; musicBtn.innerText = "🎵 音乐";
    });
  }
  musicBtn.addEventListener("click", () => {
    if (audioOn) {
      bgm.pause(); audioOn = false; musicBtn.innerText = "🔊 音乐";
    } else {
      bgm.play().then(() => { audioOn = true; musicBtn.innerText = "🔇 静音"; }).catch(()=>{});
    }
  });

  /* ---------- 爱心算法 ---------- */
  function heartPath(step) {
    const pts = [];
    for (let t = 0; t < Math.PI * 2; t += step) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
      pts.push({ x, y });
    }
    return pts;
  }
  
  function heartFill(count) {
    const pts = [];
    for (let i = 0; i < count; i++) {
      const t = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()) * 0.95; 
      const x = 16 * Math.pow(Math.sin(t), 3) * r;
      const y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)) * r;
      pts.push({ x, y });
    }
    return pts;
  }

  const floaters = [];
  let W = innerWidth, H = innerHeight;
  const cx = () => W / 2, cy = () => H / 2, XS = 1.3;
  const Y_CENTER = 2.54, Y_HEIGHT = 28.92, X_WIDTH = 32;
  
  function fitScale() {
    const pad = 28;
    const sx = (W - pad * 2) / (X_WIDTH * 10 * XS);
    const sy = (H - pad * 2) / (Y_HEIGHT * 10);
    return Math.min(sx, sy, 1.7);
  }

  // 画心阶段文字（带强发光特效）
  function makeWord(text, x, y, size) {
    const el = document.createElement("div");
    el.className = "word glow-word";
    el.innerText = text;
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.style.fontSize = size + "px";
    el.style.color = palette[Math.floor(Math.random() * palette.length)];
    el.style.opacity = "0";
    stage.appendChild(el);
    setTimeout(() => { 
      el.style.transition = "opacity .4s"; 
      el.style.opacity = ".92"; 
    }, 50);
    return el;
  }

  /* 阶段1：画轮廓 */
  function drawHeart() {
    const outline = heartPath(0.025);
    let i = 0;
    (function step() {
      if (i >= outline.length) { fillHeart(); return; }
      const p = outline[i];
      const k = fitScale();
      const px = cx() + p.x * k * 10 * XS;
      const py = cy() + (p.y - Y_CENTER) * k * 10;
      
      pen.style.left = px + "px";
      pen.style.top = py + "px";
      const nextP = outline[(i + 1) % outline.length];
      const angle = Math.atan2(nextP.y - p.y, nextP.x - p.x) * 180 / Math.PI;
      pen.style.transform = `translate(-50%,-90%) rotate(${angle + 90}deg)`;
      
      if (i % 2 === 0) {
        // 画心阶段文字稍微调小一点
        makeWord(winterWords[Math.floor(Math.random()*winterWords.length)], px, py, 9 + Math.random()*4);
      }
      i++;
      setTimeout(step, 12);
    })();
  }

  /* 阶段2：内部填满 */
  function fillHeart() {
    pen.style.display = "none";
    const fill = heartFill(300); // 300个点填满
    let i = 0;
    let lastTime = performance.now();
    
    function step(currentTime) {
      if (i >= fill.length) {
        heartDrawn = true;
        triggerExplode();
        return;
      }
      
      if (currentTime - lastTime >= 10) {
        lastTime = currentTime;
        for (let b = 0; b < 4; b++) { 
          if (i >= fill.length) break;
          const p = fill[i];
          makeWord(
            winterWords[Math.floor(Math.random()*winterWords.length)],
            cx() + p.x * fitScale() * 10 * XS,
            cy() + (p.y - Y_CENTER) * fitScale() * 10,
            8 + Math.random()*3 // 内部字号 8-11px，非常精致
          );
          i++;
        }
      }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  /* 阶段3：炸开 */
  function explode() {
    const words = stage.querySelectorAll(".word");
    words.forEach((word) => {
      const rect = word.getBoundingClientRect();
      const ox = rect.left + rect.width/2 - cx();
      const oy = rect.top + rect.height/2 - cy();
      
      const tx = ox * 1.6 + (Math.random() - 0.5) * 200;
      const ty = oy * 1.6 - 100 + (Math.random() - 0.5) * 200;
      const rotate = (Math.random() - 0.5) * 360;

      word.animate([
        { transform: "translate(-50%,-50%) scale(1)", opacity: 1 },
        { 
          transform: `translate(calc(-50% + ${tx*0.1}px), calc(-50% + ${ty*0.1}px)) scale(1.2) rotate(${rotate*0.1}deg)`, 
          opacity: 1,
          offset: 0.2
        },
        { 
          transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0.3) rotate(${rotate}deg)`, 
          opacity: 0
        }
      ], { 
        duration: 1400 + Math.random() * 400, 
        easing: "cubic-bezier(0.2, 0.8, 0.2, 1)", 
        fill: "forwards" 
      });
    });
    
    setTimeout(showFullScreen, 600);
  }

  /* 阶段4：满屏特效文字 */
  function showFullScreen() {
    let currentCount = 0;
    const maxCount = 350; // 总数量增加，但因为字小了不会拥挤
    
    const timer = setInterval(() => {
      if (currentCount >= maxCount) {
        clearInterval(timer);
        return;
      }
      for (let i = 0; i < 6; i++) {
        if (currentCount >= maxCount) break;
        createFloater();
        currentCount++;
      }
    }, 30); 
  }

  function createFloater() {
    const el = document.createElement("div");
    // 使用特效类名
    el.className = "word fx-word";
    el.innerText = winterWords[Math.floor(Math.random()*winterWords.length)];
    el.style.color = palette[Math.floor(Math.random() * palette.length)];
    
    // 【核心修改】：满屏文字大小缩小到 8px - 16px
    el.style.fontSize = (8 + Math.random()*8) + "px";
    
    const x = Math.random()*W, y = Math.random()*H;
    el.style.left = x + "px"; 
    el.style.top = y + "px";
    el.style.opacity = "0";
    
    // 随机初始旋转角度
    const initRotate = (Math.random() - 0.5) * 90;
    el.style.transform = `translate(-50%, -50%) scale(0.3) rotate(${initRotate}deg)`;
    
    stage.appendChild(el);
    
    // 随机浮动方向
    const finalRotate = initRotate + (Math.random() - 0.5) * 90;
    
    setTimeout(() => { 
      el.style.transition = "opacity 1.5s ease, transform 1.5s ease"; 
      el.style.opacity = 0.4 + Math.random()*0.6; // 透明度错落
      el.style.transform = `translate(-50%, -50%) scale(1) rotate(${finalRotate}deg)`;
    }, 50);

    // 加入随机呼吸闪烁的动画 (通过 CSS 样式控制部分元素)
    if (Math.random() > 0.5) {
      el.style.animation = `breathe ${2 + Math.random()*3}s infinite alternate`;
    }

    floaters.push({ 
      el, x, y, 
      vx: (Math.random()-0.5)*0.3, 
      vy: -(0.15+Math.random()*0.4), 
      phase: Math.random()*Math.PI*2 
    });
  }

  /* 动态注入呼吸闪烁的 CSS */
  const style = document.createElement('style');
  style.innerHTML = `
    @keyframes breathe {
      0% { opacity: 0.3; filter: brightness(0.8); }
      100% { opacity: 1; filter: brightness(1.3); }
    }
  `;
  document.head.appendChild(style);

  /* 漂浮主循环 */
  function loop() {
    floaters.forEach(f => {
      f.phase += 0.02;
      f.x += f.vx + Math.sin(f.phase)*0.3; // 左右水母摇曳
      f.y += f.vy;
      if (f.y < -40) { f.y = H + 20; f.x = Math.random()*W; }
      if (f.x < -40) f.x = W + 20;
      if (f.x > W + 40) f.x = -20;
      
      // 注意：由于这里的 left/top 改变，为了不覆盖掉 CSS 动画的 scale/rotate，采用移动位置
      f.el.style.left = f.x + "px";
      f.el.style.top = f.y + "px";
    });
    requestAnimationFrame(loop);
  }
  loop();

  /* 雪花 */
  const canvas = document.getElementById("snow");
  const ctx = canvas.getContext("2d");
  let snowList = [];
  function resize() {
    W = innerWidth; H = innerHeight;
    canvas.width = W; canvas.height = H;
  }
  resize();
  addEventListener("resize", resize);

  function initSnow() {
    snowList = [];
    const count = Math.floor(W * H / 18000);
    for (let i = 0; i < count; i++) {
      snowList.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 2 + 0.5,
        speed: Math.random() * 0.6 + 0.2,
        drift: (Math.random() - 0.5) * 0.4,
        alpha: Math.random() * 0.6 + 0.2
      });
    }
  }
  initSnow();
  addEventListener("resize", initSnow);

  function drawSnow() {
    ctx.clearRect(0, 0, W, H);
    snowList.forEach(s => {
      s.y += s.speed;
      s.x += s.drift;
      if (s.y > H + 5) { s.y = -5; s.x = Math.random() * W; }
      if (s.x < -5) s.x = W + 5;
      if (s.x > W + 5) s.x = -5;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(drawSnow);
  }
  drawSnow();
</script>
</body>
</html>
